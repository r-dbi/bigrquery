# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: live-api

jobs:
  live-api:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # TEMPORARY: diagnose segfault in arrow nested-types test
      - name: Valgrind arrow nested-types test
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y valgrind
          R CMD INSTALL .
          R -d "valgrind --track-origins=yes" --vanilla -e 'testthat::test_file("tests/testthat/test-bq-download.R", desc = "arrow api can convert nested types", package = "bigrquery", load_package = "installed")'
        env:
          BIGRQUERY_KEY: ${{ secrets.BIGRQUERY_KEY }}
          BIGQUERY_TEST_PROJECT: gargle-169921
          BIGQUERY_TEST_BUCKET: bigrquery-test-bucket-calliope

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
        env:
          BIGRQUERY_KEY: ${{ secrets.BIGRQUERY_KEY }}
          BIGQUERY_TEST_PROJECT: gargle-169921
          BIGQUERY_TEST_BUCKET: bigrquery-test-bucket-calliope
